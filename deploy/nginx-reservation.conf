# /etc/nginx/sites-available/reservation.conf on the PlagSini VPS,
# symlinked into sites-enabled. Its own file: the CSMS vhost (default) is
# never edited for this app. certbot adds the 443 server block on first issue;
# keep this repo copy in sync with the post-certbot file.

server {
    server_name reservation.c-zero.com.my;

    root /var/www/car-booking/current;
    index index.html;

    client_max_body_size 10m;   # mileage photos

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets never change; index.html must never be cached so a
    # deploy takes effect immediately. `expires`, not add_header: an add_header
    # inside a location would silently drop the server-level headers above.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/reservation.c-zero.com.my/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/reservation.c-zero.com.my/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = reservation.c-zero.com.my) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name reservation.c-zero.com.my;
    return 404; # managed by Certbot


}